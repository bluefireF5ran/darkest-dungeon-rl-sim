[pytest]
testpaths = tests

markers =
    xdist_group(name): pin a test (or, for a spiky file, a module) to one worker

# `--dist loadgroup` is a MEMORY decision, not a speed one -- and what is
# expensive is the PEAK, which is transient, not the steady state.
#
# Steady state, per worker (measured 2026-08-27):
#
#     bare python                  16 MB
#     + numpy + gymnasium          37 MB
#     + DataStore                  63 MB     <- what every file needs
#     + torch + sb3_contrib       534 MB     <- what SIX TESTS need
#
# Every xdist worker collects the WHOLE suite, so one module-level
# `from sb3_contrib import ...` was paid by all sixteen before a test ran:
# 9.65 GB peak, which is what crashed the machine. The production modules
# import sb3 lazily now (collection 626 MB -> 149 MB) and the six tests that
# genuinely load it carry `@pytest.mark.xdist_group("torch")` ON THE TEST.
#
# Do NOT pin a whole file for torch. `pytestmark` serialises every test in it
# onto one worker, and `test_live_bridge.py` is 68 s of capture decoding with
# exactly one torch test in it -- pinning the file made those 68 s the critical
# path of a 97 s suite. Per-test marks took it to 74 s.
#
# The module-level marks that remain are for MEMORY, which is the one thing
# they are right for. Sampling RSS at 20 ms inside each test found four spiky
# files -- test_pe_anchors +416 MB (a 19.3 MB PE scan), test_screen +172,
# test_mappanel +92, test_curiopanel +21, all frame decoding, none of it a
# model. Scattered, sixteen of those land at once. Grouped, one does, and they
# cost 12.9 s serially against a 63 s suite.
#
# WORKER COUNT IS NOW A MEMORY DIAL AND BARELY A SPEED ONE (re-measured
# 2026-08-27, after the DSON parser fix took ~215 s of capture decoding out of
# the suite). Wall clock and peak python RSS over the whole run:
#
#     -n auto (16)   42.4 s   7.84 GB
#     -n 12          45.6 s   8.05 GB
#     -n 8           44.9 s   5.01 GB      <- the default
#     -n 6           46.9 s   4.73 GB
#
# Eight workers cost 2.5 s (6%) and save 2.8 GB (36%). The old note here said
# `-n 8` cost ~8 s and saved ~1 GB, and that was true of a 930-core-second
# suite: sixteen workers were still filling. They are not any more -- the suite
# no longer has enough work to saturate them, so the extra eight buy queueing
# and a doubled chance that two spiky tests land at once. Peak has real
# run-to-run variance (which spikes coincide is luck -- note n=12 above reading
# higher than n=16); the 36% gap is well outside it.
#
# `-n auto` is still right on a bigger machine or a much heavier suite. Change
# it deliberately, and re-measure both columns rather than one.
#
# Current: ~2,839 tests, ~52 s, ~9.3 GB peak (re-measured 2026-09-07; the old
# note here said ~1826 tests / ~5.0 GB and had not been checked in a while).
# `tests/suite/test_suite_memory.py` is the tripwire for all of it and
# enumerates both mark sets with their measured spike.
#
# Tests live in areas -- tests/{engine,env,data,bridge,tools,training,suite} --
# since 2026-09-07. `testpaths` already recurses, so nothing here changed for
# it; but anything that WALKS the suite needs rglob, not glob. Three guards got
# that wrong on the way in and would have kept passing while checking nothing.
#
# Peak RSS is a SHORT SPIKE: sampling at 400 ms read 3.01 GB where 150 ms reads
# 5.4-6.8 GB on the same run. Sample fast or do not quote the number.
#
# NEVER run this alongside a training job -- a 12-env run is ~6 GB on its own
# and the pair already OOM'd a 3M run at the rollout-buffer allocation.
#
# Override for a single-process run when debugging (a crashed worker reports
# less clearly than a plain traceback). Use `-n0`:
#     python -m pytest tests/ -n0 -q
#     python -m pytest tests/bridge/test_run.py -n0 -q
#
# NOT `-p no:xdist`, which this file recommended until 2026-09-07 and which has
# never worked here: disabling the plugin also removes the `-n` and `--dist`
# options that `addopts` below then passes, so pytest exits 4 with
# "unrecognized arguments: -n --dist" before collecting anything.
addopts = -n 8 --dist loadgroup
